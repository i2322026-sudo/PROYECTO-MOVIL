name: movil
description: "App móvil de administración — Agroveterinaria ALEVET"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localización — pone en español los widgets nativos de Flutter
  # (selector de fecha, nombres de mes/día, botones OK/Cancel, etc.)
  flutter_localizations:
    sdk: flutter

  # Cliente HTTP para consumir la API REST del backend
  dio: ^5.4.0

  # Abrir el PDF de reportes directo en Chrome/navegador del celular
  url_launcher: ^6.3.1

  # Seleccionar el PDF de la ficha técnica desde el equipo
  file_picker: ^8.1.2

  # Compartir/descargar el Excel o PDF exportado (sin manejar archivos a mano)
  share_plus: ^10.1.2

  # Gráfico de ventas en el dashboard
  fl_chart: ^0.69.0

  # Persistencia local de la sesión (token, nombre, rol)
  shared_preferences: ^2.2.3

  # Notificaciones push (requiere google-services.json en android/app/)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Escaneo de código de barras de productos
  mobile_scanner: ^5.0.0

  # Selección de imagen al registrar un producto
  image_picker: ^1.0.7

  # Formato de fechas
  intl: 0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
