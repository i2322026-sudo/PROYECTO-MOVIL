org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Evita el bug de Kotlin al calcular rutas relativas cuando el proyecto
# y la caché de pub (~/AppData/Local/Pub/Cache) viven en discos distintos
# (ej. proyecto en D:, caché en C:). Sin esto, "flutter build apk --release"
# falla con "this and base files have different roots".
kotlin.incremental=false
